[package]
name = "yawgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
gles = ["yawgpu-core/gles", "yawgpu-hal/gles", "yawgpu-test/gles"]
# Selects the manual real-GPU diagnostic and performance probe test targets
# (`e2e_metal_leak`, `e2e_metal_compile_churn`). They are not correctness
# tests, so a routine `--ignored` real-GPU run must not build or select them.
gpu-diagnostics = []
metal = ["yawgpu-hal/metal", "yawgpu-test/metal"]
shader-passthrough = ["yawgpu-core/shader-passthrough"]
tiled = ["yawgpu-core/tiled"]
vulkan = ["yawgpu-hal/vulkan", "yawgpu-test/vulkan"]

[dependencies]
yawgpu-core = { path = "../yawgpu-core" }
yawgpu-hal = { path = "../yawgpu-hal" }

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
yawgpu-test = { path = "../yawgpu-test" }
yawgpu-hal = { path = "../yawgpu-hal" }
# Direct physical-device oracle for the real-Vulkan feature-advertisement e2e
# test (Block 99); a plain loader query, independent of the HAL.
ash = "0.38.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Retained CAMetalLayer ownership in the cross-platform Vulkan surface helper.
objc2 = { workspace = true }
# `CGSize` for sizing a standalone CAMetalLayer in the surface e2e tests.
objc2-core-foundation = { workspace = true }
# Standalone CAMetalLayer construction for the real-Metal surface e2e test.
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }
# Direct `MTLDevice.readWriteTextureSupport` oracle for the real-Metal
# `texture-formats-tier2` advertisement e2e test.
objc2-metal = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Hidden Win32 window for the real-Vulkan surface e2e test (HWND surface source).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

# Backend- and feature-only integration test targets. Automatic test discovery
# stays on; these explicit entries only add `required-features`, so a
# configuration without the feature neither builds nor launches an empty
# target. Each crate keeps its own `#![cfg(...)]` (including OS conditions).

